          example: 12
    responses:
      '200':
        description: Featured activities list
        content:
          application/json:
            schema:
              $ref: ../schemas/activity.yaml#/components/schemas/ActivityFeaturedResponse

public_activities_by_public_key:
  parameters:
    - name: publicKey
      in: path
