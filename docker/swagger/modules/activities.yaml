  get:
    tags: [Public Activities]
    summary: Get public activity by route key
    description: Reads activity by uuid-backed public route key `{slug}-{uuid}`.
    responses:
      '200':
        description: Activity details
        content:
          application/json:
            schema:
              $ref: ../schemas/activity.yaml#/components/schemas/ActivitySingleResponse
      '404':
        $ref: ../errors.yaml#/NotFoundError

