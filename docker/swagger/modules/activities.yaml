public_activities_feed:
  get:
    tags: [Public Activities]
    summary: Get public activities feed
    description: >
      Cursor-based feed for infinite loading UI.
      This endpoint is intended for client-facing scroll feed and does not use
      admin-style pagination contract. Response payload contains only `items`
      and `next_cursor`.
    parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 48
          example: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          nullable: true
      - name: search
        in: query
        required: false
        schema:
          type: string
          example: футбол
      - name: root_category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: organization_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: location_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: city_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: is_featured
        in: query
        required: false
        schema:
          type: boolean
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum: [created_at]
          example: created_at
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          enum: [asc, desc]
          example: desc
    responses:
      '200':
        description: Cursor-based activities feed
        content:
          application/json:
            schema:
              $ref: ../schemas/activity.yaml#/components/schemas/ActivityFeedResponse
            examples:
              infinite_feed:
                summary: Infinite loading response
                value:
                  status: ok
                  data:
                    items:
                      - id: 00000000-0000-0000-0000-000000000001
                        public_key: faz-zenit-vasileostrovskiy-00000000-0000-0000-0000-000000000001
                        name: ФАЗ Зенит Василеостровский
                        slug: faz-zenit-vasileostrovskiy
                        short_description: Футбольная секция для детей
                        is_featured: true
                    next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNi0wMy0xOFQxMDowMDowMFoiLCJpZCI6IjAwMDAwMDAwLTAwMDAtMDAwMC0wMDAwLTAwMDAwMDAwMDAwMSIsInNvcnRfZGlyIjoiZGVzYyJ9

